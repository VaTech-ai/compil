name: Build OpenCV Android arm64

on:
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'onglet Actions de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip

      - name: Run OpenCV Build Script
        run: |
          python build.py

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-arm64
          path: output/video-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
          
