name: build-opencv-core

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - build-core.py
      - .github/workflows/build-opencv-core.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer CMake 3.31.10
        run: |
          python -m pip install cmake==3.31.10
          cmake --version

      - name: Compiler OpenCV 5.1.0 (core + pthreads, arm64-v8a)
        run: python build-core.py

      - name: Publier l'archive
        uses: actions/upload-artifact@v4
        with:
          name: opencv-core-pthreads-arm64
          path: out/opencv-core-pthreads-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
